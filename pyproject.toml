[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "case5-unit-commitment-qaoa"
version = "0.1.0"
description = "Noisy QAOA and classical dispatch comparison for the MATPOWER five-bus unit-commitment benchmark"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sympy>=1.10",
  "pyqpanda3>=0.3.5",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.7", "pytest>=7.0"]
runtime = ["qpanda3_runtime>=1.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
